<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" preserveAspectRatio="xMinYMid slice">
  <!-- TrailerQuiz illustration: the movie scene in the background continues on the phone screen,
       where it plays as the trailer above the quiz question. Vector, so it stays sharp at any size. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.35" stop-color="#f869b9" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#121216" stop-opacity="0.6"/>
      <stop offset="0.8" stop-color="#3dc0c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fece00"/>
      <stop offset="0.45" stop-color="#fea917"/>
      <stop offset="1" stop-color="#fea917" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ceec4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6ceec4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screenFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0.85"/>
    </linearGradient>

    <!-- The movie scene, drawn once and used both as background and on the phone -->
    <g id="scene">
      <rect width="1800" height="700" fill="#0a0a0c"/>
      <rect width="1800" height="700" fill="url(#sky)"/>
      <circle cx="560" cy="300" r="260" fill="url(#sun)" opacity="0.85"/>
      <circle cx="560" cy="300" r="95" fill="#fece00" opacity="0.9"/>
      <!-- Far skyline -->
      <path fill="#1f1f26" opacity="0.85" d="M0 470 H90 V400 H140 V430 H210 V360 H260 V420 H330 V380 H370 V440 H450 V330 H500 V410 H600 V370 H650 V430 H740 V340 H800 V400 H880 V310 H930 V420 H1010 V360 H1070 V440 H1150 V300 H1200 V390 H1280 V350 H1340 V430 H1420 V320 H1480 V400 H1560 V370 H1620 V440 H1700 V350 H1800 V700 H0 Z"/>
      <!-- Near skyline -->
      <path fill="#0a0a0c" d="M0 560 H60 V470 H120 V520 H180 V430 H240 V500 H300 V460 H360 V540 H420 V440 H470 V510 H560 V480 H620 V560 H700 V450 H760 V520 H840 V470 H900 V540 H980 V420 H1040 V500 H1120 V460 H1180 V550 H1260 V430 H1320 V510 H1400 V470 H1460 V540 H1540 V440 H1600 V520 H1680 V480 H1800 V700 H0 Z"/>
      <!-- Lit windows -->
      <g fill="#fea917" opacity="0.7">
        <rect x="190" y="450" width="6" height="8"/><rect x="206" y="470" width="6" height="8"/><rect x="430" y="460" width="6" height="8"/>
        <rect x="446" y="480" width="6" height="8"/><rect x="990" y="440" width="6" height="8"/><rect x="1006" y="462" width="6" height="8"/>
        <rect x="1270" y="452" width="6" height="8"/><rect x="1286" y="474" width="6" height="8"/><rect x="1550" y="460" width="6" height="8"/>
      </g>
      <g fill="#6ceec4" opacity="0.6">
        <rect x="770" y="470" width="6" height="8"/><rect x="786" y="490" width="6" height="8"/><rect x="1130" y="480" width="6" height="8"/>
        <rect x="1410" y="490" width="6" height="8"/><rect x="1426" y="510" width="6" height="8"/><rect x="1610" y="470" width="6" height="8"/>
      </g>
      <!-- Hero silhouette walking towards the sun -->
      <g fill="#0a0a0c">
        <ellipse cx="560" cy="610" rx="120" ry="14" opacity="0.6"/>
        <path d="M548 455 a16 18 0 1 1 26 0 l6 6 c18 6 26 20 28 44 l4 54 h-16 l-6 -46 -6 0 0 102 h-20 l-4 -70 -6 70 h-20 l0 -102 -6 0 -6 46 h-16 l4 -54 c2 -24 10 -38 28 -44 z"/>
      </g>
      <!-- Flying cars -->
      <g fill="#0a0a0c" opacity="0.9">
        <path d="M1240 210 l60 -8 18 10 -10 8 -64 4 z"/>
        <path d="M1450 260 l40 -6 12 7 -7 6 -43 3 z"/>
      </g>
      <path d="M1258 222 L1150 520" stroke="#6ceec4" stroke-opacity="0.18" stroke-width="22"/>
      <rect width="1800" height="700" fill="url(#haze)"/>
    </g>

    <clipPath id="screenClip"><rect x="0" y="0" width="300" height="600" rx="34"/></clipPath>
    <clipPath id="trailerClip"><rect x="20" y="96" width="260" height="196" rx="14"/></clipPath>
  </defs>

  <!-- Background: the scene -->
  <use href="#scene"/>

  <!-- Light from the phone into the scene: the trailer on the screen is this scene -->
  <path d="M333 215 L560 230 L560 370 L333 345 Z" fill="url(#beam)" opacity="0.35"/>

  <!-- Phone: scaled down and centred, so the whole phone stays in view when the section crops the image -->
  <g transform="translate(120 150) scale(0.68)">
    <rect x="-14" y="-14" width="328" height="628" rx="46" fill="#0a0a0c"/>
    <rect x="-14" y="-14" width="328" height="628" rx="46" fill="none" stroke="#1f1f26" stroke-width="2"/>
    <g clip-path="url(#screenClip)">
      <rect width="300" height="600" fill="#121216"/>
      <!-- Status bar and app header -->
      <rect x="110" y="14" width="80" height="22" rx="11" fill="#0a0a0c"/>
      <text x="150" y="74" fill="#ffffff" font-family="'General Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="4" text-anchor="middle">TRAILERQUIZ</text>
      <!-- Trailer: the same scene, zoomed in on the hero and the sun -->
      <g clip-path="url(#trailerClip)">
        <g transform="translate(20 96) scale(0.36) translate(-190 -140)">
          <use href="#scene"/>
        </g>
        <rect x="20" y="96" width="260" height="196" fill="url(#screenFade)"/>
      </g>
      <rect x="20" y="96" width="260" height="196" rx="14" fill="none" stroke="#6ceec4" stroke-opacity="0.6" stroke-width="2"/>
      <!-- Play button and progress -->
      <circle cx="150" cy="194" r="26" fill="#0a0a0c" fill-opacity="0.55" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M142 181 L164 194 L142 207 Z" fill="#ffffff"/>
      <rect x="36" y="274" width="228" height="4" rx="2" fill="#ffffff" fill-opacity="0.25"/>
      <rect x="36" y="274" width="150" height="4" rx="2" fill="#6ceec4"/>
      <!-- Quiz question -->
      <text x="20" y="328" fill="#ffffff" fill-opacity="0.6" font-family="'General Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">QUESTION 1 OF 3</text>
      <text x="20" y="356" fill="#ffffff" font-family="'General Sans', system-ui, sans-serif" font-size="17" font-weight="700">Where does the hero walk</text>
      <text x="20" y="378" fill="#ffffff" font-family="'General Sans', system-ui, sans-serif" font-size="17" font-weight="700">in the final scene?</text>
      <g font-family="'General Sans', system-ui, sans-serif" font-size="14" font-weight="600">
        <rect x="20" y="398" width="260" height="44" rx="12" fill="#1f1f26"/>
        <text x="40" y="425" fill="#ffffff" fill-opacity="0.85">Into the rain</text>
        <rect x="20" y="452" width="260" height="44" rx="12" fill="#6ceec4"/>
        <text x="40" y="479" fill="#0a0a0c" font-weight="700">Towards the sunset</text>
        <circle cx="256" cy="474" r="9" fill="#0a0a0c"/>
        <path d="M251 474 l4 4 7 -8" stroke="#6ceec4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="20" y="506" width="260" height="44" rx="12" fill="#1f1f26"/>
        <text x="40" y="533" fill="#ffffff" fill-opacity="0.85">Back to the city</text>
      </g>
    </g>
  </g>
</svg>
