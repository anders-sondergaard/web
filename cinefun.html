<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFun — Cinemataztic</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            cyan: '#3dc0c8',
                            mint: '#6ceec4',
                            pink: '#f869b9',
                            orange: '#fea917',
                            yellow: '#fece00',
                            dark: '#0a0a0c',
                            card: '#121216',
                            border: '#1f1f26'
                        }
                    },
                    // Typography after phloe.co: General Sans, tight tracking, 1.383 body leading
                    fontFamily: {
                        sans: ['"General Sans"', 'system-ui', 'sans-serif'],
                        // Logo wordmark: Klavika Bold (installed, or Adobe Fonts kit "klavika-web"), falling back to General Sans
                        logo: ['Klavika', '"klavika-web"', '"General Sans"', 'sans-serif']
                    },
                    letterSpacing: {
                        tighter: '-0.0525em',
                        tight: '-0.021em',
                        wide: '-0.021em',
                        wider: '-0.021em',
                        widest: '-0.021em'
                    },
                    lineHeight: {
                        none: '0.76',
                        relaxed: '1.383'
                    }
                }
            },
            plugins: [
                function ({ addBase }) {
                    addBase({
                        // Logo wordmark font: an installed Klavika Bold, else the licensed webfont file
                        '@font-face': {
                            fontFamily: 'Klavika',
                            fontWeight: '700',
                            fontStyle: 'normal',
                            fontDisplay: 'swap',
                            src: "local('Klavika Bold'), local('Klavika-Bold'), url('assets/fonts/Klavika-Bold.otf') format('opentype')"
                        },
                        body: { lineHeight: '1.383' },
                        '.font-black': { letterSpacing: '-0.0525em' }
                    });
                }
            ]
        }
    </script>
    <!-- General Sans (Indian Type Foundry, free via Fontshare) -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
</head>
<body class="bg-brand-dark text-white font-sans antialiased selection:bg-brand-cyan selection:text-black min-h-screen flex flex-col">

    <!-- HEADER / NAVIGATION -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-brand-dark/80 backdrop-blur-md border-b border-brand-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2 group">
                <span class="text-2xl sm:text-3xl font-logo font-bold tracking-[0.05em] uppercase text-white group-hover:opacity-90 transition">
                    CINEMATAZTIC
                </span>
            </a>

            <nav class="hidden md:flex items-center space-x-8 text-xs font-bold tracking-widest uppercase">
                <a href="cases.html" class="hover:text-brand-cyan transition">Cases</a>
                <a href="products.html" class="text-brand-cyan">Products</a>
                <a href="index.html#cms" class="px-4 py-2 uppercase tracking-widest font-bold border border-brand-border hover:border-brand-cyan hover:text-brand-cyan transition">
                    <i class="fa-solid fa-gear mr-1"></i> CMS
                </a>
                <a href="https://www.linkedin.com/company/cinemataztic" target="_blank" rel="noopener" class="px-5 py-2.5 bg-brand-cyan text-black hover:bg-brand-yellow transition">Get in Touch</a>
            </nav>

            <button id="mobileMenuBtn" class="md:hidden text-2xl text-white focus:outline-none" aria-label="Open menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <div id="mobileDrawer" class="hidden md:hidden bg-brand-dark/95 border-b border-brand-border px-6 py-6 space-y-4">
            <a href="cases.html" class="block text-lg font-bold uppercase hover:text-brand-cyan">Cases</a>
            <a href="products.html" class="block text-lg font-bold uppercase text-brand-cyan">Products</a>
            <a href="https://www.linkedin.com/company/cinemataztic" target="_blank" rel="noopener" class="block text-lg font-bold uppercase hover:text-brand-cyan">Get in Touch</a>
            <hr class="border-brand-border my-2">
            <a href="index.html#cms" class="block w-full text-left py-2 text-sm uppercase font-bold text-brand-cyan">
                <i class="fa-solid fa-gear mr-2"></i> Open CMS Admin
            </a>
        </div>
    </header>

    <main class="flex-grow pt-20">
        <!-- CineFun page: content to come -->
    </main>

    <footer class="bg-black border-t border-brand-border py-12 text-sm text-gray-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-2 text-center md:text-left">
                <span class="text-2xl font-logo font-bold tracking-[0.05em] uppercase text-white">CINEMATAZTIC</span>
                <p class="text-xs text-gray-400">© 2026 Cinemataztic ApS. All rights reserved.</p>
            </div>
            <div class="flex space-x-6 text-xs uppercase tracking-wider font-bold">
                <a href="index.html#about" class="hover:text-brand-cyan">Studio</a>
                <a href="products.html" class="hover:text-brand-cyan">Products</a>
                <a href="cases.html" class="hover:text-brand-cyan">Cases</a>
                <a href="https://www.linkedin.com/company/cinemataztic" target="_blank" rel="noopener" class="hover:text-brand-cyan">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('mobileDrawer').classList.toggle('hidden');
        });
    </script>
</body>
</html>
